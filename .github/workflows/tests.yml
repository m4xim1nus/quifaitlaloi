# Tests à chaque push et PR. Le déploiement n'est pas ici : Cloudflare Pages est relié au dépôt
# et exécute `bash build.sh` à chaque push sur main.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (pipeline et site)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Tests pipeline (les tests `donnees` exigent les dumps, sautés en CI)
        working-directory: pipeline
        run: uv run --quiet pytest -q

      - name: Tests site
        working-directory: site
        run: |
          npm ci
          npm run check
          npm test
          npm run format:check

      - name: Build du site
        run: bash build.sh
